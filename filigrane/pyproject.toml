[project]
name = "filigrane"
version = "0.2.0"
description = "Filigrane texte tuilé, non destructif, sur images et PDF. Source du script embarqué dans la skill erom-image/filigrane."
readme = "README.md"
authors = [
    { name = "eRom", email = "romain.ecarnot@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.0",
    "pillow>=11.0.0",
    "pillow-heif>=1.0.0",
    "pypdf>=6.0.0",
    "reportlab>=4.0.0",
    "typer>=0.15.0",
]

[project.scripts]
filigrane = "filigrane.cli:run"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
